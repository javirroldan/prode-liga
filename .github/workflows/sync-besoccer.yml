name: Sync BeSoccer

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fechas de jornadas futuras (1x/día)
        run: |
          curl -f --max-time 240 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://prode-liga.vercel.app/api/cron/sync-besoccer?mode=fixture"
